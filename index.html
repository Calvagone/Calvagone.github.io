<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campsis Has Moved</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        #progress-bar {
            transition: width 1s linear;
        }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-800 min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-zinc-900 selection:text-white">

    <!-- Header -->
    <header class="w-full border-b border-zinc-200 bg-white/80 backdrop-blur-sm">
        <div class="max-w-3xl mx-auto px-6 py-4 flex justify-between items-center text-xs tracking-wide">
            <span class="font-medium text-zinc-900 uppercase tracking-widest">Campsis Suite</span>
            <span class="text-zinc-400">Documentation Relocation</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="my-auto px-6 py-12 flex items-center justify-center">
        <div class="max-w-md w-full bg-white border border-zinc-200 rounded-xl p-8 sm:p-10 shadow-sm space-y-8">
            
            <!-- Message Header -->
            <div class="space-y-3">
                <div class="inline-flex items-center text-xs font-mono uppercase tracking-wider text-zinc-500 bg-zinc-100 px-2.5 py-1 rounded">
                    Notice
                </div>
                <h1 class="text-2xl font-semibold text-zinc-900 tracking-tight">
                    We've moved
                </h1>
                <p class="text-sm text-zinc-600 leading-relaxed">
                    The official Campsis suite documentation and project website have relocated to a new home.
                </p>
            </div>

            <!-- New URL Box -->
            <div class="p-4 rounded-lg bg-zinc-50 border border-zinc-200 space-y-1">
                <span class="text-xs text-zinc-400 uppercase font-mono tracking-wider block">New Address</span>
                <a href="https://campsisverse.github.io/" class="text-sm font-mono font-medium text-zinc-900 hover:text-zinc-600 transition-colors break-all flex items-center justify-between group">
                    <span>https://campsisverse.github.io/</span>
                    <span class="text-xs text-zinc-400 group-hover:text-zinc-900 transition-colors ml-2">→</span>
                </a>
            </div>

            <!-- Auto Redirect Tracker -->
            <div class="space-y-2 pt-2">
                <div class="flex justify-between items-center text-xs text-zinc-500">
                    <span id="redirect-status">Redirecting in <span id="countdown-text" class="font-mono text-zinc-900 font-medium">5s</span></span>
                    <button id="cancel-btn" onclick="cancelRedirect()" class="text-zinc-400 hover:text-zinc-900 underline transition-colors">
                        Cancel
                    </button>
                </div>
                <div class="w-full bg-zinc-100 h-1 rounded-full overflow-hidden">
                    <div id="progress-bar" class="bg-zinc-900 h-full w-full"></div>
                </div>
            </div>

            <!-- CTA Button -->
            <div>
                <a href="https://campsisverse.github.io/" class="w-full inline-flex items-center justify-center gap-2 px-5 py-3 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-white text-sm font-medium transition-all">
                    <span>Go to new site</span>
                    <span class="text-xs text-zinc-400">↵</span>
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-xs text-zinc-400 border-t border-zinc-100">
        <p>Campsis Open-Source Project &middot; calvagone.github.io</p>
    </footer>

    <!-- Script Logic -->
    <script>
        const targetUrl = "https://campsisverse.github.io/";
        let secondsLeft = 5;
        const totalDuration = 5;
        let redirectTimer = null;

        const countdownElement = document.getElementById('countdown-text');
        const progressBar = document.getElementById('progress-bar');
        const redirectStatus = document.getElementById('redirect-status');
        const cancelBtn = document.getElementById('cancel-btn');

        function startCountdown() {
            progressBar.style.width = '100%';

            redirectTimer = setInterval(() => {
                secondsLeft--;
                if (secondsLeft >= 0) {
                    countdownElement.innerText = secondsLeft + 's';
                    const percentage = (secondsLeft / totalDuration) * 100;
                    progressBar.style.width = percentage + '%';
                }

                if (secondsLeft <= 0) {
                    clearInterval(redirectTimer);
                    window.location.href = targetUrl;
                }
            }, 1000);
        }

        function cancelRedirect() {
            if (redirectTimer) {
                clearInterval(redirectTimer);
                redirectTimer = null;
            }
            
            progressBar.style.width = '0%';
            progressBar.classList.remove('bg-zinc-900');
            progressBar.classList.add('bg-zinc-300');
            
            redirectStatus.innerText = 'Automatic redirect cancelled';
            cancelBtn.style.display = 'none';
        }

        window.onload = function() {
            startCountdown();
        };
    </script>
</body>
</html>
